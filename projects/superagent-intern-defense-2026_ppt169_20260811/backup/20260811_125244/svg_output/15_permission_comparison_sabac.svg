<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" data-pptx-page-role="content" font-family="Microsoft YaHei, Arial, sans-serif">
  <rect id="background" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <g id="title-block" data-pptx-bounds="52 32 1170 126">
    <text x="58" y="62" font-family="Arial, Microsoft YaHei, sans-serif" font-size="16" font-weight="bold" letter-spacing="1.3" fill="#F28C28">04 / AUTHORIZATION BENCHMARK</text>
    <text x="58" y="104" font-size="34" font-weight="bold" fill="#1E2A36">S-ABAC 把权限从 Prompt 约束升级为</text>
    <text x="58" y="142" font-size="34" font-weight="bold" fill="#0B5CAD">执行系统硬边界</text>
  </g>
  <g id="permission-benchmark" data-pptx-bounds="58 166 1164 164">
    <rect x="58" y="166" width="184" height="164" fill="#F3F7FB"/>
    <rect x="252" y="166" width="184" height="164" fill="#F3F7FB"/>
    <rect x="446" y="166" width="184" height="164" fill="#F3F7FB"/>
    <rect x="640" y="166" width="184" height="164" fill="#F3F7FB"/>
    <rect x="834" y="166" width="184" height="164" fill="#F3F7FB"/>
    <rect x="1028" y="166" width="194" height="164" fill="#FFF7EE" stroke="#F28C28" stroke-width="3"/>
    <text x="78" y="202" font-family="Arial, Microsoft YaHei, sans-serif" font-size="19" font-weight="bold" fill="#0B5CAD">ACL</text>
    <text x="78" y="238" font-size="15" fill="#1E2A36">对象级许可清晰</text>
    <text x="78" y="270" font-size="14" fill="#516273">规模扩大后难维护</text>
    <text x="272" y="202" font-family="Arial, Microsoft YaHei, sans-serif" font-size="19" font-weight="bold" fill="#0B5CAD">RBAC</text>
    <text x="272" y="238" font-size="15" fill="#1E2A36">岗位 / 角色稳定</text>
    <text x="272" y="270" font-size="14" fill="#516273">任务目的表达不足</text>
    <text x="466" y="202" font-family="Arial, Microsoft YaHei, sans-serif" font-size="19" font-weight="bold" fill="#0B5CAD">ABAC / ReBAC</text>
    <text x="466" y="238" font-size="15" fill="#1E2A36">属性 / 关系细粒度</text>
    <text x="466" y="270" font-size="14" fill="#516273">需业务语义建模</text>
    <text x="660" y="202" font-family="Arial, Microsoft YaHei, sans-serif" font-size="19" font-weight="bold" fill="#0B5CAD">OPA / Cedar</text>
    <text x="660" y="238" font-size="15" fill="#1E2A36">外置 PDP / 策略语言</text>
    <text x="660" y="270" font-size="14" fill="#516273">生产迁移候选</text>
    <text x="854" y="202" font-size="18" font-weight="bold" fill="#0B5CAD">OpenAI Guardrails</text>
    <text x="854" y="238" font-size="15" fill="#1E2A36">输入 / 输出 / 工具校验</text>
    <text x="854" y="270" font-size="14" fill="#516273">授权关系仍由应用实现</text>
    <text x="1048" y="202" font-family="Arial, Microsoft YaHei, sans-serif" font-size="19" font-weight="bold" fill="#F28C28">SuperAgent</text>
    <text x="1048" y="238" font-size="15" font-weight="bold" fill="#1E2A36">任务场景参与授权</text>
    <text x="1048" y="270" font-size="14" fill="#7A5A38">四 PEP + 三态 + 审计</text>
    <text x="58" y="322" font-size="14" font-weight="bold" fill="#F28C28">结论：角色只是 Subject 的一个属性，不能代表本次任务的完整授权上下文。</text>
  </g>
  <g id="sabac-policy-flow" data-pptx-bounds="58 364 1164 250">
    <text x="58" y="390" font-size="17" font-weight="bold" fill="#516273">S-ABAC = Subject × Object × Scenario × Action</text>
    <rect x="58" y="414" width="226" height="80" fill="#EAF4FB" stroke="#0B5CAD" stroke-width="3"/>
    <rect x="58" y="514" width="226" height="80" fill="#EAF4FB" stroke="#0B5CAD" stroke-width="3"/>
    <rect x="310" y="414" width="226" height="80" fill="#EFF8FB" stroke="#4CA6C6" stroke-width="3"/>
    <rect x="310" y="514" width="226" height="80" fill="#FFF7EE" stroke="#F28C28" stroke-width="3"/>
    <text x="80" y="446" font-family="Arial, Microsoft YaHei, sans-serif" font-size="18" font-weight="bold" fill="#0B5CAD">Subject</text>
    <text x="80" y="474" font-size="14" fill="#1E2A36">用户 / Agent / 部门 / 信任 / 委托</text>
    <text x="80" y="546" font-family="Arial, Microsoft YaHei, sans-serif" font-size="18" font-weight="bold" fill="#0B5CAD">Object</text>
    <text x="80" y="574" font-size="14" fill="#1E2A36">Agent / Tool / Artifact / 敏感度</text>
    <text x="332" y="446" font-family="Arial, Microsoft YaHei, sans-serif" font-size="18" font-weight="bold" fill="#0B5CAD">Scenario</text>
    <text x="332" y="474" font-size="14" fill="#1E2A36">业务目的 / 风险 / 审批 / 环境</text>
    <text x="332" y="546" font-family="Arial, Microsoft YaHei, sans-serif" font-size="18" font-weight="bold" fill="#F28C28">Action</text>
    <text x="332" y="574" font-size="14" fill="#1E2A36">read / write / send / delete / approve</text>
    <line x1="284" y1="454" x2="592" y2="488" stroke="#0B5CAD" stroke-width="3"/>
    <line x1="284" y1="554" x2="592" y2="520" stroke="#0B5CAD" stroke-width="3"/>
    <line x1="536" y1="454" x2="592" y2="488" stroke="#4CA6C6" stroke-width="3"/>
    <line x1="536" y1="554" x2="592" y2="520" stroke="#F28C28" stroke-width="3"/>
    <rect x="592" y="444" width="220" height="116" fill="#0B5CAD"/>
    <text x="702" y="492" text-anchor="middle" font-family="Consolas, Microsoft YaHei, monospace" font-size="20" font-weight="bold" fill="#FFFFFF">PolicyEngine</text>
    <text x="702" y="524" text-anchor="middle" font-size="15" fill="#FFFFFF">策略匹配 · 冲突消解 · trace</text>
    <line x1="812" y1="502" x2="860" y2="502" stroke="#0B5CAD" stroke-width="4"/>
    <rect x="860" y="414" width="362" height="54" fill="#EAF7F2"/>
    <rect x="860" y="478" width="362" height="54" fill="#F8EEEE"/>
    <rect x="860" y="542" width="362" height="54" fill="#FFF7EE"/>
    <text x="884" y="449" font-family="Consolas, Microsoft YaHei, monospace" font-size="18" font-weight="bold" fill="#21A179">ALLOW</text>
    <text x="1000" y="449" font-size="15" fill="#1E2A36">策略直接允许</text>
    <text x="884" y="513" font-family="Consolas, Microsoft YaHei, monospace" font-size="18" font-weight="bold" fill="#D95C5C">DENY</text>
    <text x="1000" y="513" font-size="15" fill="#1E2A36">不可由审批提升</text>
    <text x="884" y="577" font-family="Consolas, Microsoft YaHei, monospace" font-size="17" font-weight="bold" fill="#F28C28">REVIEW_REQUIRED</text>
    <text x="1080" y="577" font-size="15" fill="#1E2A36">仅此态可人工放行</text>
  </g>
  <g id="footer" data-pptx-bounds="58 650 1164 42">
