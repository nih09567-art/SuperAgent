<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" data-pptx-page-role="content" font-family="Microsoft YaHei, Arial, sans-serif">
  <rect id="background" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <g id="title-block" data-pptx-bounds="52 32 1170 126">
    <text x="58" y="62" font-family="Arial, Microsoft YaHei, sans-serif" font-size="16" font-weight="bold" letter-spacing="1.3" fill="#F28C28">02 / CONTROL PLANE × DATA PLANE × TOOL RESOLVER</text>
    <text x="58" y="106" font-size="34" font-weight="bold" fill="#1E2A36">控制面决定何时执行，数据面决定传什么；</text>
    <text x="58" y="144" font-size="32" font-weight="bold" fill="#0B5CAD">48 个工具先收敛到 2.17 个候选</text>
  </g>
