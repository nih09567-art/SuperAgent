    <text x="82" y="382" font-size="22" font-weight="bold" fill="#0B5CAD">① 上下文压缩</text>
    <text x="82" y="420" font-size="16" fill="#1E2A36">写入：窗口超限前</text>
    <text x="82" y="452" font-size="16" fill="#1E2A36">保留：最近两轮 + 未完成计划</text>
    <text x="82" y="484" font-size="16" fill="#1E2A36">召回：当前会话</text>
    <text x="82" y="532" font-size="15" font-weight="bold" fill="#516273">Plan / TaskGraph / Artifact 不丢失</text>
    <text x="472" y="382" font-size="22" font-weight="bold" fill="#0B5CAD">② 长期 Memory</text>
