    <text x="862" y="484" font-size="16" fill="#1E2A36">召回：只增强对应 Plan 步骤</text>
    <text x="862" y="532" font-size="15" font-weight="bold" fill="#7A5A38">不跳过 Planner；高风险副作用单独拦截</text>
